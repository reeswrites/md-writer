<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drafter</title>
  <meta name="description" content="A markdown editor where the preview is the writing surface. Many drafts, real files, committed as you write.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c2703d'/%3E%3Cg fill='none' stroke='%23faf9f7' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7 22V11l5 5 5-5v11'/%3E%3Cpath d='M22 11v11'/%3E%3Cpath d='M19 19l3 3 3-3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="head-main">
        <h1 id="title" contenteditable="true" spellcheck="false"></h1>
        <div class="subtitle" id="subtitle" contenteditable="true" spellcheck="false" data-ph="Add a subtitle…"></div>
        <div class="meta">
          <span class="wc" id="wc" data-tip=""></span>
          <span class="flags-wrap">
            <span class="flags" id="flagcount"></span>
            <div class="flag-jump" id="flagJump"></div>
          </span>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="controls">
        <button class="btn drafts-btn" id="drafts-btn" hidden title="Switch or create a draft">
          <span id="drafts-label">Drafts</span>
          <svg class="caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
        </button>
        <div class="drafts-panel" id="drafts-panel" hidden>
          <div class="drafts-head">
            <span id="drafts-dir"></span>
            <button class="btn" id="new-draft">New draft</button>
          </div>
          <form class="new-draft-row" id="new-draft-row" hidden>
            <input id="new-draft-title" type="text" placeholder="Title…" autocomplete="off">
            <button class="btn" type="submit">Create</button>
          </form>
          <div class="drafts-list" id="drafts-list"></div>
        </div>
        <span class="status" id="status" data-tip="Saved in this browser (localStorage)">saved</span>
        <button class="btn icon" id="settings-btn" title="Settings" aria-label="Settings">⚙</button>
        <div class="settings-panel" id="settings" hidden>
          <div class="set-row"><span>Theme</span><button class="btn" id="theme">◐</button></div>
          <label class="set-row"><span>Word count</span><input type="checkbox" id="opt-wc"></label>
          <label class="set-row"><span>TODO / FIXME counts</span><input type="checkbox" id="opt-flags"></label>
          <label class="set-row"><span>Reading progress</span><input type="checkbox" id="opt-progress"></label>
          <div class="set-sep"></div>
          <button class="set-action" id="copy">Copy all markdown</button>
          <button class="set-action danger" id="clear">Clear document…</button>
        </div>
      </div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    </header>
    <div class="top-cover"></div>

    <div class="editor" id="editor"></div>

    <div class="hint">
      click any line to edit &nbsp;·&nbsp; <kbd>↑</kbd> <kbd>↓</kbd> move between lines &nbsp;·&nbsp; <kbd>⌘</kbd><kbd>↑</kbd><kbd>↓</kbd> move line &nbsp;·&nbsp; <kbd>Enter</kbd> new line &nbsp;·&nbsp; <kbd>Esc</kbd> deselect &nbsp;·&nbsp; <kbd>⇧</kbd> click or drag to multi-select &nbsp;·&nbsp; <kbd>⌘</kbd><kbd>⇧</kbd><kbd>7</kbd>/<kbd>8</kbd> list ↔ numbered
    </div>
  </div>

  <script src="js/drafts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
